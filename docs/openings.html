<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn the chess openings move by move: what every move is for, the idea of the whole opening, and its variations side by side.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Opening Learner · Chess Vision Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--pc-wk:url("img/wk.webp");--pc-wq:url("img/wq.webp");--pc-wr:url("img/wr.webp");--pc-wb:url("img/wb.webp");--pc-wn:url("img/wn.webp");--pc-wp:url("img/wp.webp");--pc-bk:url("img/bk.webp");--pc-bq:url("img/bq.webp");--pc-br:url("img/br.webp");--pc-bb:url("img/bb.webp");--pc-bn:url("img/bn.webp");--pc-bp:url("img/bp.webp")}
/* Shared by every drill page (scripts/build.js inlines it into each one): tokens, header, board, buttons, feedback, stats, settings, celebration effects. */
/* Look: a chess book on a study table. Warm paper and ink, grotesque headings, mono notation, a clay set on a walnut board.
   Layout: board on the left, one continuous panel on the right (top card + side); on phones the panel splits around the board. */
:root{
  --bg:#F3EEE3; --surface:#FFFDF8; --surface-2:#F8F4EB; --ink:#221E18; --muted:#6F6758; --line:#E2DACB; --line-strong:#CDC3AF;
  --primary:#221E18; --primary-ink:#FFFDF8;
  --accent:#1F6B4E; --accent-ink:#FFFFFF; --accent-soft:rgba(31,107,78,.11);
  --sq-light:#FAE7BC; --sq-dark:#C5A86F; --hl:rgba(255,186,102,.55); --co-light:#94733D; --co-dark:#FFF7E0;
  --good:#23704A; --good-soft:rgba(35,112,74,.09); --bad:#B23A2C; --bad-soft:rgba(178,58,44,.09);
  --good-solid:#2C8A55; --good-deep:#1C5C38; --bad-solid:#C8432F; --bad-deep:#86281C; --on-solid:#FFFFFF;
  --ann-g:#15781B; --ann-r:#C42B2B; --ann-b:#1F4FD0; --ann-y:#E68F00;
  --shadow:0 1px 0 rgba(255,255,255,.6) inset, 0 18px 40px -30px rgba(60,40,15,.45);
  --f-display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14120E; --surface:#1D1A15; --surface-2:#25211B; --ink:#EEE7D9; --muted:#A2998A; --line:#322D25; --line-strong:#463F34;
  --primary:#EEE7D9; --primary-ink:#17140F;
  --accent:#7CC6A0; --accent-ink:#0E1A14; --accent-soft:rgba(124,198,160,.14);
  --sq-light:#FAE7BC; --sq-dark:#C5A86F; --hl:rgba(255,186,102,.55); --co-light:#94733D; --co-dark:#FFF7E0;
  --good:#6FCB96; --good-soft:rgba(111,203,150,.1); --bad:#FF7C6B; --bad-soft:rgba(255,124,107,.1);
  --good-solid:#2E9159; --good-deep:#1A5734; --bad-solid:#D04B37; --bad-deep:#7E251A;
  --shadow:0 18px 40px -28px rgba(0,0,0,.8);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14120E; --surface:#1D1A15; --surface-2:#25211B; --ink:#EEE7D9; --muted:#A2998A; --line:#322D25; --line-strong:#463F34;
  --primary:#EEE7D9; --primary-ink:#17140F;
  --accent:#7CC6A0; --accent-ink:#0E1A14; --accent-soft:rgba(124,198,160,.14);
  --sq-light:#FAE7BC; --sq-dark:#C5A86F; --hl:rgba(255,186,102,.55); --co-light:#94733D; --co-dark:#FFF7E0;
  --good:#6FCB96; --good-soft:rgba(111,203,150,.1); --bad:#FF7C6B; --bad-soft:rgba(255,124,107,.1);
  --good-solid:#2E9159; --good-deep:#1A5734; --bad-solid:#D04B37; --bad-deep:#7E251A;
  --shadow:0 18px 40px -28px rgba(0,0,0,.8);
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--ink);overflow-x:clip}
body{font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
a{color:inherit;text-decoration-color:var(--line-strong);text-underline-offset:3px}
a:hover{text-decoration-color:currentColor}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{max-width:1120px;margin:0 auto;padding-block:14px 32px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:22px}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px 24px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.brand-mark{width:34px;height:34px;border-radius:9px;flex:none;background:#2A2119 var(--pc-wn) center bottom/auto 112% no-repeat;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.brand h1{font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em;margin:0}
.top-right{display:flex;align-items:center;gap:6px 20px;flex-wrap:wrap}
.tools{display:flex;gap:22px;flex-wrap:wrap}
.tool-tab{padding:8px 0;font-weight:600;font-size:14.5px;color:var(--muted);text-decoration:none;box-shadow:inset 0 -2px 0 transparent;transition:color .12s, box-shadow .12s}
.tool-tab:hover{color:var(--ink)}
.tool-tab[aria-current="page"]{color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}

/* main grid: the top card and the side join into one panel beside the board */
.bench{display:grid;grid-template-columns:minmax(0,1fr) 384px;grid-template-areas:"board line" "board side";grid-template-rows:auto 1fr;gap:0 36px;align-items:start}
.line-card{grid-area:line}
.board-col{grid-area:board;display:flex;flex-direction:column;gap:10px;min-width:0}
.side{grid-area:side;display:flex;flex-direction:column;gap:18px;min-width:0;align-self:stretch;
  background:var(--surface);border:1px solid var(--line);border-top:0;border-radius:0 0 16px 16px;padding:4px 20px 0;box-shadow:var(--shadow)}
.bench > .line-card{border-radius:16px 16px 0 0;border-bottom:0;padding:20px 20px 18px;position:relative;box-shadow:none}
.bench > .line-card::after{content:"";position:absolute;left:20px;right:20px;bottom:0;border-bottom:1px solid var(--line)}
.side > .card{background:transparent;border:0;border-radius:0;padding:16px 0 0;border-top:1px solid var(--line);box-shadow:none}
@media (max-width:860px){
  .bench{grid-template-columns:minmax(0,1fr);grid-template-areas:"line" "board" "side";grid-template-rows:auto;gap:14px}
  .bench > .line-card{border-radius:16px;border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
  .bench > .line-card::after{display:none}
  .side{border-top:1px solid var(--line);border-radius:16px;padding-top:18px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.eyebrow{font-size:11px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
/* board: img/board.webp is the walnut frame around 8 tiles on a 132px pitch, seen from above with the frame's front edge below:
   the frame is 5.59% of the playing area at the sides, 4.07% at the top and 10.13% at the bottom.
   The shell is the playing area and the frame is drawn around it. Pieces stand taller than their square. */
.board-shell{--w:min(100% / 1.112, 576px, (100vh - 140px) / 1.112);width:var(--w);min-width:min(100% / 1.112, 252px);margin:calc(var(--w) * .052) auto calc(var(--w) * .101 + 6px);position:relative;isolation:isolate}
.board-shell::before{content:"";position:absolute;inset:-4.07% -5.59% -10.13%;z-index:-1;background:url("img/board.webp") center/100% 100%;
  filter:drop-shadow(0 2px 2px rgba(40,25,10,.35)) drop-shadow(0 16px 16px rgba(40,25,10,.3))}
.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;max-width:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.sq{position:relative}
.sq .co{position:absolute;font-family:var(--f-body);font-size:clamp(8px,1.4vw,11px);font-weight:700;line-height:1;pointer-events:none}
.sq .co.f{right:4px;bottom:3px}
.sq .co.r{left:4px;top:4px}
.sq .co{color:var(--co-light)}
.sq.dk .co{color:var(--co-dark)}
.sq::after{content:"";position:absolute;inset:1.5%;border-radius:4%;pointer-events:none;z-index:0}
.sq.hl::after{inset:0;border-radius:0;background:var(--hl)}  /* the whole square, unlike the outlines below */
.sq.sel::after{box-shadow:inset 0 0 0 3px var(--accent);background:var(--accent-soft)}
.sq.bad::after{box-shadow:inset 0 0 0 3px var(--bad-solid);background:var(--bad-soft)}
.sq[data-an]::before{content:"";position:absolute;inset:1.5%;border-radius:4%;pointer-events:none;z-index:0;background:var(--an);opacity:.6}
.sq[data-an="g"]{--an:var(--ann-g)}.sq[data-an="r"]{--an:var(--ann-r)}.sq[data-an="b"]{--an:var(--ann-b)}.sq[data-an="y"]{--an:var(--ann-y)}
.arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3;overflow:visible}
/* drop-shadow follows the frame's outline; stacked, they make a ring */
.board-shell:has(.board.solved)::before{filter:drop-shadow(0 0 1px var(--good-solid)) drop-shadow(0 0 1.5px var(--good-solid)) drop-shadow(0 0 1.5px var(--good-solid)) drop-shadow(0 0 2px var(--good-solid)) drop-shadow(0 0 2px var(--good-solid)) drop-shadow(0 16px 16px rgba(40,25,10,.3))}
.board.editable .sq{cursor:pointer}
.board.stamping .sq{cursor:copy}
.board.erasing .sq{cursor:not-allowed}
/* piece images are a square wide and 1.25 tall, base at the bottom: on the board their base sits a quarter of the way up the square, so they read as centred (the tallest, on the far rank, reach just past the frame) */
.pc{position:absolute;inset:0;z-index:1;background:center/contain no-repeat;pointer-events:none}
.board .pc{inset:auto 0 24% 0;height:125%;background-size:100% 100%;filter:drop-shadow(0 3px 2px rgba(20,12,4,.35))}
.pc.lift{opacity:.25}
.drag-ghost{position:fixed;z-index:1000;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);aspect-ratio:4/5;background:center/100% 100% no-repeat;filter:drop-shadow(0 6px 8px rgba(0,0,0,.35))}
.wp{background-image:var(--pc-wp)}.wn{background-image:var(--pc-wn)}.wb{background-image:var(--pc-wb)}.wr{background-image:var(--pc-wr)}.wq{background-image:var(--pc-wq)}.wk{background-image:var(--pc-wk)}
.bp{background-image:var(--pc-bp)}.bn{background-image:var(--pc-bn)}.bb{background-image:var(--pc-bb)}.br{background-image:var(--pc-br)}.bq{background-image:var(--pc-bq)}.bk{background-image:var(--pc-bk)}
.board-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;max-width:min(640px, calc(100vh - 140px));width:100%;margin:0 auto;min-height:34px}
.board-bar:first-child{margin-bottom:8px}
@media (max-width:560px){.board-bar:first-child{flex-wrap:nowrap}.board-bar:first-child .row{flex-wrap:nowrap;gap:2px}.board-bar .btn.small{padding:6px 8px}.view-tag{font-size:15px;white-space:nowrap}}
.board-bar:last-child{margin-top:8px}
.board-bar:has(> .legend[hidden]){display:none}
.view-tag{font-family:var(--f-display);font-size:16px;font-weight:700;color:var(--ink);letter-spacing:-.005em}
.count-pill{font-family:var(--f-mono);font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums;cursor:help}
.count-pill.full{background:var(--good-solid);border-color:var(--good-solid);color:var(--on-solid)}
.count-pill.over{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.view-tag.good{color:var(--good)} .view-tag.bad{color:var(--bad)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);border-radius:10px;padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .12s, border-color .12s, transform .08s}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.4;cursor:default}
.btn:disabled:hover{background:var(--surface);border-color:var(--line-strong)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--primary-ink);padding:13px 20px;font-size:15px;border-radius:12px;box-shadow:0 1px 0 rgba(255,255,255,.12) inset, 0 6px 14px -8px rgba(0,0,0,.5)}
.btn.primary:hover{background:var(--primary);border-color:var(--primary);filter:brightness(1.18)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn.ghost:hover:not(:disabled){background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.split{justify-content:space-between}
.kbd{font-family:var(--f-mono);font-size:10.5px;font-weight:600;opacity:.6;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:6px}
@media (hover:none){.kbd{display:none}} /* touch screens have no Enter key to hint at */
.row.split > .btn.primary{flex:1 1 auto}

/* feedback: the panel's main message. Plain on start; a tinted, outlined box once there is a verdict. */
.feedback{display:flex;flex-direction:column;gap:12px;padding:16px 0 0}
.feedback.good,.feedback.bad{padding:14px 16px;border-radius:12px;margin-top:14px;border:1px solid color-mix(in srgb, var(--fb) 32%, transparent)}
.feedback.good{--fb:var(--good-solid);background:var(--good-soft)}
.feedback.bad{--fb:var(--bad-solid);background:var(--bad-soft)}
.feedback h3{margin:0;font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.2;letter-spacing:-.01em}
.feedback.good h3{color:var(--good)} .feedback.bad h3{color:var(--bad)}
.feedback p{margin:0;font-size:14.5px;color:var(--ink)}
.feedback .hint{color:var(--muted);font-size:13px}
.feedback .actions{display:flex;flex-direction:column;gap:10px}
.feedback .actions > .btn.primary{width:100%;margin-top:2px}
.howto{font-size:13px;color:var(--muted)}
.howto summary{display:inline-flex;align-items:center;gap:7px;cursor:pointer;font-weight:600;list-style:none;padding:2px 0}
.howto summary::-webkit-details-marker{display:none}
.howto summary::before{content:"";width:6px;height:6px;border-right:1.5px solid currentColor;border-bottom:1.5px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
.howto[open] summary::before{transform:rotate(45deg)}
.howto summary:hover{color:var(--ink)}
.howto p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin:auto -20px 0;border-top:1px solid var(--line)}
.stat{display:flex;flex-direction:column;gap:1px;padding:13px 20px 15px}
.stat + .stat{border-left:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-weight:800;font-size:22px;font-variant-numeric:tabular-nums lining-nums;line-height:1.1;letter-spacing:-.01em}
.stat span{font-size:10.5px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;font-weight:600}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:6px 0 0}
/* after-check animations */
@keyframes wave{0%{transform:none}40%{transform:translateY(-18%) scale(1.12) rotate(-4deg)}75%{transform:translateY(3%) scale(.97)}100%{transform:none}}
.pc.wave{animation:wave .32s cubic-bezier(.3,.7,.4,1) both}
.board-shell::after{content:"";position:absolute;inset:-4.07% -5.59% -10.13%;border-radius:3.2%;pointer-events:none;opacity:0;z-index:4}
@keyframes flashfx{0%{opacity:.5}100%{opacity:0}}
.board-shell.flash-good::after{background:var(--good-solid);animation:flashfx .35s ease-out}
.board-shell.flash-bad::after{background:var(--bad-solid);animation:flashfx .35s ease-out}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-10px) rotate(-1deg)}40%{transform:translateX(9px) rotate(1deg)}60%{transform:translateX(-6px)}80%{transform:translateX(3px)}}
.shake{animation:shake .3s ease-in-out}
@keyframes flash{0%,100%{background:var(--bad-soft)}50%{background:color-mix(in srgb, var(--bad) 50%, transparent)}}
.sq.bad.flash::after{animation:flash .28s ease-in-out 3}
.confetti{position:absolute;left:50%;top:50%;width:var(--s);height:calc(var(--s) * .6);background:var(--c);border-radius:2px;pointer-events:none;z-index:5;
  animation:burst .75s cubic-bezier(.12,.75,.3,1) forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) rotate(0);opacity:1}
  75%{opacity:1}
  100%{transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) rotate(var(--r));opacity:0}}
@keyframes slam{0%{transform:translate(-50%,-50%) scale(2.4) rotate(var(--tilt));opacity:0}
  16%{transform:translate(-50%,-50%) scale(.9) rotate(var(--tilt));opacity:1}
  26%{transform:translate(-50%,-50%) scale(1.06) rotate(var(--tilt))}
  34%,78%{transform:translate(-50%,-50%) scale(1) rotate(var(--tilt));opacity:1}
  100%{transform:translate(-50%,-85%) scale(.9) rotate(var(--tilt));opacity:0}}
.stamp{--tilt:-6deg;position:absolute;left:50%;top:50%;z-index:6;pointer-events:none;padding:12px 26px 15px;border-radius:14px;font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,46px);letter-spacing:-.02em;white-space:nowrap;line-height:1;
  background:var(--good-solid);color:var(--on-solid);border:2px solid rgba(255,255,255,.35);box-shadow:0 7px 0 var(--good-deep), 0 18px 30px -10px rgba(0,0,0,.5);text-shadow:0 2px 0 var(--good-deep);
  animation:slam .85s cubic-bezier(.2,.9,.3,1) forwards}
.stamp.bad{--tilt:5deg;background:var(--bad-solid);box-shadow:0 7px 0 var(--bad-deep), 0 18px 30px -10px rgba(0,0,0,.5);text-shadow:0 2px 0 var(--bad-deep);animation-duration:.7s}
.stamp small{display:block;font-family:var(--f-body);font-weight:600;font-size:.33em;letter-spacing:.1em;text-transform:uppercase;opacity:.92;margin-top:6px;text-shadow:none}
.feedback.bad.shake{animation:shake .3s ease-in-out}
.settings{position:relative}
.icon-btn{display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line-strong);background:var(--surface);font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink)}
.icon-btn:hover{border-color:var(--muted)}
.icon-btn svg{width:17px;height:17px}
.icon-btn[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
.settings-panel{position:absolute;right:0;top:calc(100% + 8px);z-index:50;width:min(340px, calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:14px;
  box-shadow:0 24px 50px -20px rgba(30,20,5,.45);padding:6px 18px 10px;animation:panelin .14s ease-out}
@keyframes panelin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.settings-panel .grp{margin:14px 0 2px}
.opt{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:11px 0;border-top:1px solid var(--line);cursor:pointer}
.grp + .opt{border-top:0}
.opt .txt{display:flex;flex-direction:column;gap:2px;min-width:0}
.opt .txt b{font-size:14px;font-weight:600;color:var(--ink)}
.opt .txt span{font-size:12.5px;color:var(--muted);line-height:1.45}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.switch{flex:none;margin-top:2px;width:36px;height:21px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .15s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#FFFFFF;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.opt input:checked + .txt + .switch{background:var(--accent)}
.opt input:checked + .txt + .switch::after{transform:translateX(15px)}
.opt input:focus-visible + .txt + .switch{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary.counting{position:relative;overflow:hidden}
.btn.primary.counting::after{content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;background:var(--primary-ink);opacity:.5;transform-origin:left;animation:countdown var(--dur) linear forwards;animation-delay:var(--delay)}
@keyframes countdown{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.stay{font-size:13px;color:var(--muted);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

/* Opening Learner: a row of stacked panes under the header, like Andy Matuschak's notes. The first pane lists the
   openings; picking one opens its line to the right, and each variation opens in a pane to the right of the line it
   branches from. One line open fills the screen beside the list; two share it half and half; with more, the older ones
   slide under their neighbour and leave a spine with their title. A wide pane puts the board beside the text. */
:root{--spine:44px;--pw:468px;--iw:356px;--head-h:72px}
html,body{height:100%}
body{overflow:hidden}
.app{max-width:none;padding-bottom:0;gap:0;padding-left:max(18px, env(safe-area-inset-left, 0px));padding-right:max(18px, env(safe-area-inset-right, 0px))}
.top{border-bottom:0}

.stack{display:flex;align-items:stretch;height:calc(100vh - var(--head-h));height:calc(100dvh - var(--head-h));overflow-x:auto;overflow-y:hidden;
  border-top:1px solid var(--line);overscroll-behavior-x:contain;scrollbar-width:thin}
.pane{flex:none;width:var(--pw);height:100%;position:sticky;left:calc(var(--k) * var(--spine));background:var(--surface);
  border-right:1px solid var(--line);box-shadow:-10px 0 24px -18px rgba(40,25,10,.45)}
.pane.index{width:var(--iw);background:var(--surface-2);box-shadow:none}

.spine{position:absolute;left:0;top:0;bottom:0;width:var(--spine);display:none;align-items:flex-start;justify-content:center;padding:16px 0;border:0;border-right:1px solid var(--line);
  background:inherit;cursor:pointer;z-index:5;color:var(--muted);font:600 14px var(--f-body);text-align:left}
.spine span{writing-mode:vertical-rl;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-height:100%}
.spine:hover{color:var(--ink);background:var(--surface-2)}
.pane.collapsed .spine{display:flex}
.pane.collapsed .pane-body{opacity:0;pointer-events:none}
.hint-pane{flex:1 0 260px;display:grid;place-items:center;padding:24px;color:var(--muted);font-size:14px;text-align:center}

.find input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* a line: its title, the board (stays in view while the notes scroll), the idea, every move with its note, the variations */
.line .pane-body{scroll-padding-top:var(--board-h,0px)}
.pane-head{padding:16px 20px 10px}
.crumbs{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}

.mrow .note{color:var(--muted)}
.mrow.cur{background:var(--accent-soft)}

.alts{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px 94px;font-size:12px;color:var(--muted)}

<div class="app" id="app">
  <header class="top">
    <div class="brand"><div class="brand-mark" aria-hidden="true"></div><h1>Chess Vision Lab</h1></div>
    <div class="top-right"><nav class="tools" aria-label="Drills"><a class="tool-tab" href="index.html">Line Vision</a><a class="tool-tab" href="spot-the-danger.html">Spot the Danger</a><a class="tool-tab" href="mistake-patterns.html">Mistake Patterns</a><a class="tool-tab" href="openings.html" aria-current="page">Opening Learner</a></nav><script>(function(n){function f(){var a=n.querySelector("[aria-current]"),d=a.getBoundingClientRect().right-n.getBoundingClientRect().right;if(d>0)n.scrollLeft+=d+24;}f();if(document.fonts)document.fonts.ready.then(f);})(document.currentScript.previousElementSibling)</script></div>
  </header>
</div>
<main class="stack" id="stack" aria-label="Openings and their variations"></main>

<script src="chess.js"></script>
<script src="openings.js"></script>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
const FILES='abcdefgh';
const GROUPS={open:['1.e4 e5','Open games'],'semi-open':['1.e4, other replies','Semi-open games'],closed:['1.d4 d5','Closed games'],
  indian:['1.d4, other replies','Indian defences'],flank:['1.c4, 1.Nf3, 1.f4','Flank openings']};
const byId=new Map(OPENINGS.map(o=>[o.id,o]));
const label=(p,san)=>Math.floor(p/2)+1+(p%2?'...':'.')+san;
const narrow=()=>matchMedia('(max-width:720px)').matches;

/* ---------- lines ---------- */
/* A node is one line on show: an opening, or a variation of the line before it in the stack.
   sans/notes cover the whole line from move 1; own is where its annotated moves start (the moves before come from the
   line it branches from); at, for a variation or a linked opening, is the ply where it leaves that line. */
function root(o,at){
  return {o,title:o.name,sans:o.moves.map(m=>m[0]),notes:o.moves.map(m=>m[1]),own:0,idea:o.idea,vars:o.vars,at:at==null?null:at,side:o.side};
}
function child(node,v){
  if(v.ref)return Object.assign(root(byId.get(v.ref),v.at),{parent:node});
  return {o:node.o,title:v.name,sans:node.sans.slice(0,v.at).concat(v.moves.map(m=>m[0])),notes:node.notes.slice(0,v.at).concat(v.moves.map(m=>m[1])),
    own:v.at,idea:v.idea,vars:v.vars,at:v.at,side:node.side,parent:node,summary:v.summary};
}
/* positions after each ply (0 = the start), with the last move's squares */
function positions(sans){
  const c=new Chess(), out=[{fen:c.fen(),from:null,to:null}];
  for(const s of sans){const m=c.move(s);out.push({fen:c.fen(),from:m.from,to:m.to});}
  return out;
}
/* the first move of a variation, as it is played */
const firstMove=(node,v)=>v.ref?byId.get(v.ref).moves[v.at][0]:v.moves[0][0];
/* how many variations sit under a variation (for the "n more" hint) */
const depth=v=>v.ref?0:(v.vars||[]).length;
/* The moves that name an opening: one ply past where it leaves the closest other opening in the list, not counting the
   ones it links to (a Najdorf is named by 5...a6, not by 1.e4 c5). */
const keyLen=new Map();
(function(){
  const refs=o=>{const s=new Set();(function walk(vs){for(const v of vs||[]){if(v.ref)s.add(v.ref);else walk(v.vars);}})(o.vars);return s;};
  for(const o of OPENINGS){
    const skip=refs(o);let best=0;
    for(const p of OPENINGS){if(p===o||skip.has(p.id))continue;let k=0;while(k<o.moves.length&&k<p.moves.length&&o.moves[k][0]===p.moves[k][0])k++;best=Math.max(best,k);}
    keyLen.set(o.id,Math.min(o.moves.length,best+1));
  }
})();
const movesText=(sans,from,to)=>{let h='';for(let p=from;p<to;p++)h+=(p%2===0?(p/2+1)+'.':(p===from?Math.floor(p/2)+1+'...':''))+sans[p]+' ';return h.trim();};

/* ---------- the stack ---------- */
/* panes[0] is the list; then the opening (path []), then one pane per variation opened (path of indices into vars) */
const stackEl=$('stack');
const panes=[];
let focusK=0;
const hashFor=(id,path)=>'#'+id+(path.length?'/'+path.join('/'):'');
function parseHash(){
  const h=decodeURIComponent(location.hash.slice(1)).split('/').filter(Boolean);
  if(!h.length||!byId.has(h[0]))return null;
  const nodes=[root(byId.get(h[0]))];
  for(const x of h.slice(1)){const n=nodes[nodes.length-1], v=n.vars[+x];if(!/^\d+$/.test(x)||!v)break;nodes.push(child(n,v));}
  return {id:h[0],path:h.slice(1,nodes.length).map(Number),nodes};
}
/* rebuilds the panes to match the address, keeping the ones that are still there (and where they were in their line) */
function sync(){
  const want=parseHash();
  const nodes=want?want.nodes:[];
  const keys=nodes.map((n,k)=>want.id+'/'+want.path.slice(0,k).join('/'));
  let keep=1;
  while(keep<panes.length&&keep-1<keys.length&&panes[keep].key===keys[keep-1])keep++;
  const grew=keys.length+1>keep;
  while(panes.length>keep)panes.pop().el.remove();
  for(let k=keep-1;k<keys.length;k++){
    const node=nodes[k], prev=panes[panes.length-1];
    const ply=node.at!=null?Math.min(node.sans.length,node.at+1):0;
    panes.push(linePane(node,keys[k],want.path.slice(0,k),ply));
    if(prev.node&&node.at!=null)setPly(prev,Math.min(node.at,prev.node.sans.length));
  }
  hint.hidden=panes.length>1;
  stackEl.appendChild(hint);
  panes.forEach((p,k)=>{p.el.style.setProperty('--k',k);markOpen(p,k);});
  renderIndexCurrent();
  focusK=panes.length-1;
  requestAnimationFrame(()=>{layout();if(grew)reveal(panes.length-1,true);else onScroll();});
  const cur=nodes[nodes.length-1];
  document.title=(cur?cur.title+' · ':'')+'Opening Learner · Chess Vision Lab';
}
function go(id,path){const h=hashFor(id,path);if(location.hash===h)sync();else location.hash=h;}
/* every pane's path counts from the opening in the first line pane, so a linked opening's variations keep the chain */
function closeFrom(k){if(k<=1)location.hash='';else go(panes[1].node.o.id,panes[k].path.slice(0,-1));}
const hint=document.createElement('div');hint.className='hint-pane';
hint.innerHTML='<p><b>Pick an opening</b>Its moves open here, each with what it is for. Variations open beside it, so you can follow a line as deep as you like and step back.</p>';

/* natural left edge of pane k (before sticking) */
const naturalLeft=k=>{let x=0;for(let j=0;j<k;j++)x+=panes[j].el.offsetWidth;return x;};
function reveal(k,smooth){
  const spine=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--spine'))||44;
  let x;
  if(narrow())x=naturalLeft(k);
  else if(k===panes.length-1)x=stackEl.scrollWidth;          // the newest: as far right as it goes
  else x=naturalLeft(k)-k*spine;
  stackEl.scrollTo({left:x,behavior:smooth&&!reduced()?'smooth':'auto'});
}
function onScroll(){
  for(let k=0;k<panes.length;k++){
    const a=panes[k].el.getBoundingClientRect(), b=k+1<panes.length?panes[k+1].el.getBoundingClientRect():null;
    panes[k].el.classList.toggle('collapsed',!!b&&!narrow()&&b.left-a.left<a.width*.45);
  }
  if(narrow()){const k=Math.round(stackEl.scrollLeft/Math.max(1,stackEl.clientWidth));if(panes[k])focusK=k;}
}
stackEl.addEventListener('scroll',onScroll,{passive:true});
/* Line panes on a desktop: one fills the room beside the list; from two on, the newest two share the screen, with a
   spine for each pane before them (at least 560px each, or they overlap). Phones keep one pane per screen (CSS). */
function sizePanes(){
  const n=panes.length-1;
  if(narrow()||!n){stackEl.style.removeProperty('--pw');return;}
  const css=getComputedStyle(document.documentElement), spine=parseFloat(css.getPropertyValue('--spine'))||44, iw=indexPane.el.offsetWidth;
  const w=stackEl.clientWidth, pw=n===1?w-iw:Math.max(560,Math.floor((w-spine*(n-1))/2));
  stackEl.style.setProperty('--pw',Math.max(pw,420)+'px');
}
function layout(){
  const top=$('app').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--head-h',Math.ceil(top)+'px');
  sizePanes();
  for(const p of panes)if(p.boardEl)p.body.style.setProperty('--board-h',p.boardBox.offsetHeight+'px');
}
addEventListener('resize',()=>{layout();onScroll();});
addEventListener('hashchange',sync);
const reduced=()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches;}catch(e){return false;}};

/* ---------- the list of openings ---------- */
const F={q:'',side:''};
const indexPane=(function(){
  const el=document.createElement('section');el.className='pane index';el.setAttribute('aria-label','Openings');
  el.innerHTML='<button class="spine" aria-label="Back to the list of openings"><span>Openings</span></button><div class="pane-body">'+
    '<h2>Openings</h2><p class="lede">Pick one to learn it move by move: what every move is for, the idea behind the whole opening, and its main variations, each in a pane of its own.</p>'+
    '<div class="find"><input type="search" id="q" placeholder="Search: name, ECO code or moves" aria-label="Search openings" autocomplete="off">'+
    '<div class="chips" role="group" aria-label="Played by"><button class="btn" data-s="" aria-pressed="true">All</button><button class="btn" data-s="w" aria-pressed="false">For White</button><button class="btn" data-s="b" aria-pressed="false">For Black</button></div></div>'+
    '<div id="list"></div><p class="credit">'+OPENINGS.length+' openings. Every move is checked with chess.js; ←/→ step through the line in the pane you are reading.</p></div>';
  stackEl.appendChild(el);
  const pane={el,body:el.querySelector('.pane-body'),key:'',node:null};
  el.querySelector('.spine').onclick=()=>reveal(0,true);
  return pane;
})();
panes.push(indexPane);
function renderList(){
  const q=F.q.trim().toLowerCase().replace(/\s+/g,' '), list=$('list');
  const norm=s=>s.toLowerCase().replace(/[’']/g,'').normalize('NFD').replace(/[̀-ͯ]/g,'');
  let h='', n=0;
  for(const g of Object.keys(GROUPS)){
    const os=OPENINGS.filter(o=>o.group===g&&(!F.side||o.side===F.side)&&(!q||norm([o.name,o.eco,movesText(o.moves.map(m=>m[0]),0,keyLen.get(o.id)),o.summary].join(' ')).includes(norm(q))));
    if(!os.length)continue;n+=os.length;
    h+='<div class="group"><h3 class="eyebrow">'+GROUPS[g][1]+'<small>'+GROUPS[g][0]+'</small></h3>'+os.map(o=>
      '<button class="op" data-id="'+o.id+'"><span class="nm">'+esc(o.name)+'<small>'+esc(o.eco)+' · '+(o.side==='w'?'White':'Black')+'</small></span>'+
      '<span class="mv">'+esc(movesText(o.moves.map(m=>m[0]),0,keyLen.get(o.id)))+'</span><span class="sum">'+esc(o.summary)+'</span></button>').join('')+'</div>';
  }
  list.innerHTML=h||'<p class="none">No opening matches “'+esc(F.q)+'”.</p>';
  renderIndexCurrent();
}
function renderIndexCurrent(){
  const cur=panes[1]&&panes[1].node?panes[1].node.o.id:null;
  $('list').querySelectorAll('.op').forEach(b=>b.setAttribute('aria-current',b.dataset.id===cur?'true':'false'));
}
$('q').addEventListener('input',e=>{F.q=e.target.value;renderList();});
indexPane.el.querySelector('.chips').addEventListener('click',e=>{const b=e.target.closest('[data-s]');if(!b)return;F.side=b.dataset.s;
  indexPane.el.querySelectorAll('.chips .btn').forEach(x=>x.setAttribute('aria-pressed',x===b?'true':'false'));renderList();});
$('list').addEventListener('click',e=>{const b=e.target.closest('.op');if(b)go(b.dataset.id,[]);});

/* ---------- a line's pane ---------- */
function linePane(node,key,path,ply){
  const k=panes.length, o=node.o, el=document.createElement('section');
  el.className='pane line';el.setAttribute('aria-label',node.title);
  const parent=panes[k-1];
  const isVar=node.own>0&&node.parent, isRef=node.at!=null&&!isVar;
  const crumb=isVar?'Variation':GROUPS[o.group][1];
  const backTo=k===1?'Openings':parent.node.title;
  let from='';
  if(node.at!=null&&parent.node)from='<p class="from">'+(isVar?'Branches from ':'Leaves ')+'<button data-a="parent">'+esc(parent.node.title)+'</button> '+
    (node.at>0?'after '+esc(label(node.at-1,node.sans[node.at-1])):'at the first move')+', with '+esc(label(node.at,node.sans[node.at]))+'.</p>';
  // moves
  let mv='';
  const altsAt=new Map();
  node.vars.forEach((v,i)=>{const a=Math.max(v.at,node.own);if(!altsAt.has(a))altsAt.set(a,[]);altsAt.get(a).push(i);});
  const altHtml=(p,cont)=>{const is=altsAt.get(p);if(!is)return '';
    return '<div class="alts">'+(cont?'Continue:':'Instead:')+is.map(i=>{const v=node.vars[i];
      return '<button class="alt" data-v="'+i+'"><b>'+esc(label(v.at,firstMove(node,v)))+'</b><span>'+esc(v.name)+'</span></button>';}).join('')+'</div>';};
  if(node.own>0){
    mv+='<div class="prefix"><span>From '+esc(node.parent.title)+':</span>';
    for(let p=0;p<node.own;p++)mv+='<button class="pm" data-p="'+(p+1)+'">'+esc(p%2===0||p===0?label(p,node.sans[p]):node.sans[p])+'</button>';
    mv+='</div>';
  }
  for(let p=node.own;p<node.sans.length;p++){
    const no=Math.floor(p/2)+1;
    mv+='<button class="mrow" data-p="'+(p+1)+'"><span class="san">'+(p%2===0?no+'.':'<i>'+no+'...</i>')+esc(node.sans[p])+'</span><span class="note">'+esc(node.notes[p])+'</span></button>'+altHtml(p,false);
  }
  mv+=altHtml(node.sans.length,true);
  const vars=node.vars.length?'<section class="sec"><h3 class="eyebrow">Variations</h3><div class="vars">'+node.vars.map((v,i)=>
    '<button class="var" data-v="'+i+'"><span class="vn"><b>'+esc(label(v.at,firstMove(node,v)))+'</b>'+esc(v.name)+(depth(v)?'<span class="deep">· '+depth(v)+' more inside</span>':'')+(v.ref?'<span class="deep">· opening</span>':'')+'</span>'+
    '<span class="vs">'+esc(v.summary||'')+'</span><span class="go" aria-hidden="true">›</span></button>').join('')+'</div></section>':'';
  el.innerHTML='<button class="spine" aria-label="Show '+esc(node.title)+'"><span>'+esc(node.title)+'</span></button><div class="pane-body"><div class="pane-inner">'+
    '<div class="pane-head"><div class="crumbs"><span class="eyebrow">'+esc(crumb)+'</span><span class="row"><button class="btn small ghost back" data-a="back">‹ '+esc(backTo)+'</button>'+
      '<button class="btn small ghost x" data-a="close" aria-label="Close" title="Close (Esc)">×</button></span></div>'+
    '<h2>'+esc(node.title)+'</h2><div class="tags"><span class="tag">'+esc(o.eco)+'</span><span class="tag side-'+o.side+'">'+(o.side==='w'?'Played by White':'Played by Black')+'</span>'+
      (isVar||isRef?'':'<span class="tag">'+GROUPS[o.group][0]+'</span>')+'</div>'+from+'</div>'+
    '<div class="pane-board"><div class="board-bar bar-top"><span class="now" data-r="now"></span><button class="btn small ghost" data-a="flip" title="Flip the board">Flip</button></div>'+
      '<div class="board-shell"><div class="board" role="img"></div><svg class="arrows" viewBox="0 0 8 8" aria-hidden="true"></svg></div>'+
      '<div class="board-bar bar-steps"><div class="steps"><button class="btn small" data-a="first" aria-label="To the start">⏮</button><button class="btn small" data-a="prev" aria-label="Previous move (←)">‹</button>'+
      '<span class="count" data-r="count"></span><button class="btn small" data-a="next" aria-label="Next move (→)">›</button><button class="btn small" data-a="last" aria-label="To the end">⏭</button></div></div>'+
      '<p class="cur-note" data-r="note" aria-live="polite"></p></div>'+
    '<section class="sec idea"><h3 class="eyebrow">'+(isVar?'The idea of this variation':'The idea')+'</h3>'+node.idea.map(p=>'<p>'+esc(p)+'</p>').join('')+'</section>'+
    '<section class="sec moves"><h3 class="eyebrow">Move by move</h3>'+mv+'</section>'+vars+
    '<p class="end">'+(node.vars.length?'Pick a variation to open it beside this line.':'The end of this line.')+'</p></div></div>';
  stackEl.appendChild(el);
  const boardEl=el.querySelector('.board'), sqEls=[];
  for(let d=0;d<64;d++){const s=document.createElement('div');s.className='sq';boardEl.appendChild(s);sqEls.push(s);}
  const pane={el,key,node,path,body:el.querySelector('.pane-body'),boardEl,boardBox:el.querySelector('.pane-board'),sqEls,
    pos:positions(node.sans),ply:-1,flipped:o.side==='b'};
  el.addEventListener('click',e=>{
    const kk=panes.indexOf(pane);focusK=kk;
    if(e.target.closest('.spine')){reveal(kk,true);return;}
    const v=e.target.closest('[data-v]');if(v){go(panes[1].node.o.id,pane.path.concat(+v.dataset.v));return;}
    const p=e.target.closest('[data-p]');if(p){setPly(pane,+p.dataset.p);return;}
    if(e.target.closest('.board')){setPly(pane,pane.ply+1);return;}
    const a=e.target.closest('[data-a]');if(!a)return;
    ({first:()=>setPly(pane,0),prev:()=>setPly(pane,pane.ply-1),next:()=>setPly(pane,pane.ply+1),last:()=>setPly(pane,pane.pos.length-1),
      flip:()=>{pane.flipped=!pane.flipped;drawBoard(pane);},close:()=>closeFrom(kk),back:()=>reveal(kk-1,true),parent:()=>reveal(kk-1,true)})[a.dataset.a]();
  });
  /* pointing at a variation shows where it branches, with its first move as an arrow */
  const over=e=>{const v=e.target.closest('[data-v]');preview(pane,v?node.vars[+v.dataset.v]:null);};
  el.addEventListener('pointerover',over);el.addEventListener('focusin',over);
  el.addEventListener('pointerleave',()=>preview(pane,null));el.addEventListener('focusout',e=>{if(!el.contains(e.relatedTarget))preview(pane,null);});
  setPly(pane,ply,true);
  return pane;
}
function setPly(pane,ply,quiet){
  ply=Math.max(0,Math.min(pane.pos.length-1,ply));
  if(ply===pane.ply)return;
  pane.ply=ply;pane.preview=null;drawBoard(pane);
  const n=pane.node;
  pane.el.querySelector('[data-r="now"]').innerHTML=ply===0?'Start <small>· the initial position</small>':esc(label(ply-1,n.sans[ply-1]))+(ply-1<n.own?' <small>· before the variation</small>':'');
  pane.el.querySelector('[data-r="count"]').textContent=ply+' / '+n.sans.length;
  pane.el.querySelector('[data-r="note"]').innerHTML=ply===0?'The starting position. Step through the line with › or →.':
    ply-1<n.own?'Played before the variation, in '+esc(n.parent.title)+'.':'<b>'+esc(label(ply-1,n.sans[ply-1]))+'</b>'+esc(n.notes[ply-1]);
  pane.el.querySelectorAll('.mrow,.pm').forEach(r=>{const p=+r.dataset.p;r.classList.toggle('cur',p===ply);r.classList.toggle('later',p>ply);});
  pane.el.querySelector('[data-a="prev"]').disabled=pane.el.querySelector('[data-a="first"]').disabled=ply===0;
  pane.el.querySelector('[data-a="next"]').disabled=pane.el.querySelector('[data-a="last"]').disabled=ply===pane.pos.length-1;
  if(!quiet){const r=pane.el.querySelector('.mrow.cur');if(r)r.scrollIntoView({block:'nearest',behavior:reduced()?'auto':'smooth'});}
}
function preview(pane,v){
  if(pane.preview===v)return;
  pane.preview=v;drawBoard(pane);
}
const idx=s=>(8-(+s[1]))*8+FILES.indexOf(s[0]);
function arrowSvg(pane,f,t){
  const pt=sq=>{const i=pane.flipped?63-idx(sq):idx(sq);return [i%8+.5,Math.floor(i/8)+.5];};
  const [x1,y1]=pt(f),[x2,y2]=pt(t),len=Math.hypot(x2-x1,y2-y1),ux=(x2-x1)/len,uy=(y2-y1)/len;
  const H=.42,W=.3,bx=x2-ux*H,by=y2-uy*H,r=n=>n.toFixed(3);
  return '<g opacity=".8" style="fill:var(--ann-g);stroke:var(--ann-g)"><line x1="'+r(x1)+'" y1="'+r(y1)+'" x2="'+r(bx+ux*.02)+'" y2="'+r(by+uy*.02)+'" stroke-width=".17" stroke-linecap="round"/>'+
    '<polygon style="stroke:none" points="'+r(x2)+','+r(y2)+' '+r(bx-uy*W)+','+r(by+ux*W)+' '+r(bx+uy*W)+','+r(by-ux*W)+'"/></g>';
}
function drawBoard(pane){
  // the variation pointed at, or else the one open to the right while this board is where it branches
  const v=pane.preview||(pane.open&&pane.open.at===pane.ply?pane.open:null), P=pane.pos[v?v.at:pane.ply];
  let arrow='';
  if(v){const c=new Chess(P.fen), m=c.move(firstMove(pane.node,v));arrow=arrowSvg(pane,m.from,m.to);}
  pane.el.querySelector('.arrows').innerHTML=arrow;
  const rows=P.fen.split(' ')[0].split('/'), b=new Array(64).fill(null);
  rows.forEach((r,ri)=>{let f=0;for(const ch of r){if(ch>='1'&&ch<='8')f+=+ch;else{b[ri*8+f]=(ch===ch.toUpperCase()?'w':'b')+ch.toLowerCase();f++;}}});
  const hl=P.from?[idx(P.from),idx(P.to)]:[];
  for(let d=0;d<64;d++){
    const i=pane.flipped?63-d:d, r=Math.floor(i/8), f=i%8, el=pane.sqEls[d];
    el.className='sq'+((r+f)%2?' dk':'')+(hl.includes(i)?' hl':'');
    let h=b[i]?'<div class="pc '+b[i]+'"></div>':'';
    if(d%8===0)h+='<span class="co r">'+(8-r)+'</span>';
    if(d>=56)h+='<span class="co f">'+FILES[f]+'</span>';
    el.innerHTML=h;
  }
  pane.boardEl.setAttribute('aria-label','Board '+(pane.ply?'after '+label(pane.ply-1,pane.node.sans[pane.ply-1]):'at the start'));
}
/* the variation open to the right of a pane is marked in its list */
function markOpen(p,k){
  if(!p.node)return;
  const next=panes[k+1], i=next?next.path[next.path.length-1]:null;
  p.el.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-current',next&&+b.dataset.v===i?'true':'false'));
  const open=next?p.node.vars[i]:null;
  if(open!==p.open){p.open=open;drawBoard(p);}
}

/* ---------- keys ---------- */
document.addEventListener('keydown',e=>{
  if(e.target.closest&&e.target.closest('input,textarea'))return;
  const p=panes[focusK];
  if(e.key==='Escape'&&panes.length>1){e.preventDefault();closeFrom(panes.length-1);return;}
  if(!p||!p.node)return;
  const step={ArrowRight:1,ArrowLeft:-1}[e.key];
  if(step){e.preventDefault();setPly(p,p.ply+step);}
  else if(e.key==='Home'){e.preventDefault();setPly(p,0);}
  else if(e.key==='End'){e.preventDefault();setPly(p,p.pos.length-1);}
});

renderList();
layout();
sync();
if(document.fonts)document.fonts.ready.then(()=>{layout();onScroll();});
})();
</script>

</body>
</html>
